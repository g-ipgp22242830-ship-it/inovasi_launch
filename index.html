<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPGKI 2026</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: serif; }
        #main-ui { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('perasmian penutupan sign.jpg') no-repeat center center; 
            background-size: 100% 100%; display: flex; align-items: center; justify-content: center;
        }
        /* 签名画板容器：确保在最上层且能接收触摸 */
        /* --- 酷炫：给签名区加上霓虹边框 --- */
        #sign-wrapper {
    position: absolute; 
    /* --- 修改这里来对准 --- */
    top: 80%;  /* 如果签名偏上，就调大（如 55%）；偏下就调小（如 53%） */
    left: 50%; /* 如果签名偏左，就调大（如 51%）；偏右就调小（如 49%） */
    /* -------------------- */
    transform: translate(-50%, -50%);
    width: 50vw; 
    height: 60vh; 
    z-index: 100; 
    touch-action: none;
}
        canvas#paintCanvas { width: 100%; height: 100%; display: block; }
        
        .launch-btn {
            position: absolute; bottom: 12%; right: 7.5%;
            width: 12vw; height: 12vw; max-width: 150px; max-height: 150px;
            background: transparent; border: none; border-radius: 50%;
            cursor: pointer; z-index: 200;
        }

        #video-layer { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; }
        #video-layer video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

<div id="main-ui">
    <div id="sign-wrapper"><canvas id="paintCanvas"></canvas></div>
    <button class="launch-btn" onclick="triggerLaunch()"></button>
</div>

<div id="video-layer">
    <video id="launchVideo" src="penutupan-A.mp4" playsinline preload="auto"></video>
</div>

<script>
    const pubnub = new PubNub({ publishKey: 'demo', subscribeKey: 'demo', userId: "ipgki_" + Math.random() });
    const channel = 'ipgki_grand_matrix_v1';
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const v = document.getElementById('launchVideo');
    const isTablet = new URLSearchParams(window.location.search).get('role') === 'tablet';

    function setup() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#0a1a3a'; // 这里换成你喜欢的颜色代码
        ctx.lineWidth = 7;           // 稍微调粗到 7-8 左右，签名更有张力
        // ----------------
    }
    ctx.shadowColor = 'rgba(0,0,0,0.3)'; // 淡淡的黑色阴影
        ctx.shadowBlur = 4;                  // 让笔划稍微浮起来一点
    window.onload = setup;
    window.onresize = setup;

    let allStrokes = [], currentPoints = [];

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        allStrokes.forEach(s => {
            if (s.length < 2) return;
            ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
            s.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        });
        if(currentPoints.length > 0) {
            ctx.beginPath(); ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
            currentPoints.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }
    }

    if (isTablet) {
        canvas.addEventListener('pointerdown', e => {
            const r = canvas.getBoundingClientRect();
            const p = {x: e.clientX - r.left, y: e.clientY - r.top};
            currentPoints = [p];
            pubnub.publish({ channel, message: { a: 's', x: p.x/r.width, y: p.y/r.height } });
        });
        canvas.addEventListener('pointermove', e => {
            if (e.buttons !== 1) return;
            const r = canvas.getBoundingClientRect();
            const p = {x: e.clientX - r.left, y: e.clientY - r.top};
            currentPoints.push(p); redraw();
            pubnub.publish({ channel, message: { a: 'm', x: p.x/r.width, y: p.y/r.height } });
        });
        window.addEventListener('pointerup', () => {
            if (currentPoints.length > 0) { allStrokes.push([...currentPoints]); currentPoints = []; }
            pubnub.publish({ channel, message: { a: 'e' } });
        });
    }

    pubnub.subscribe({ channels: [channel] });
    pubnub.addListener({ message: m => {
        const d = m.message;
        const r = canvas.getBoundingClientRect();
        if(d.a === 's' && !isTablet) { currentPoints = [{x: d.x*r.width, y: d.y*r.height}]; }
        else if(d.a === 'm' && !isTablet) { currentPoints.push({x: d.x*r.width, y: d.y*r.height}); redraw(); }
        else if(d.a === 'e' && !isTablet) { if(currentPoints.length>0)allStrokes.push([...currentPoints]); currentPoints=[]; }
        else if(d.a === 'l') { 
            // 电脑端收到信号执行
            if (!isTablet) executeGrandLaunch(); 
        }
    }});

    // --- 关键修改：平板端点击按钮的同时立刻启动本地视频 ---
    // --- 强制修正版：确保平板点击必出视频 ---
    function triggerLaunch() { 
        if (isTablet) {
            const v = document.getElementById('launchVideo');
            v.muted = true;
            
            // 1. 核心：不等视频结果，立刻在本地切到 Terima Kasih 页面
            executeGrandLaunch();

            // 2. 尝试后台播放（即使报错被拦截，也不影响上面 UI 的切换）
            v.play().catch(e => console.log("Video blocked"));
        }

        // 3. 发送信号给大屏幕
        pubnub.publish({ channel: channel, message: { a: 'l' } }); 
    }
    // --- 最终版：平板流光感谢页面 (TERIMA KASIH + 线条闪烁) ---
    function executeGrandLaunch() {
        const v = document.getElementById('launchVideo');
        
        if (isTablet) {
            // 平板端：强制立刻执行，不等待任何动画
            console.log("Tablet Launch Successful"); 
            
            // 1. 彻底清空当前页面，防止旧 UI 干扰
            document.body.innerHTML = '';
            document.body.style.background = '#000'; // 确保背景纯黑

            // 2. 重新构建启动成功界面层
            const thankYouLayer = document.createElement('div');
            thankYouLayer.id = "thanks-feedback";
            thankYouLayer.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                background: #000; z-index: 99999;
                font-family: serif;
            `;
            
            // 注意：这里文件名空格已处理，增加兼容性
            thankYouLayer.innerHTML = `
                <img src="PERASMIAN PENUTUPAN (1).png" style="width: 250px; margin-bottom: 40px; filter: drop-shadow(0 0 15px #00f2ff);">
                
                <div style="width: 200px; height: 2px; background: rgba(0,242,255,0.2); position: relative; overflow: hidden; margin-bottom: 25px;">
                    <div id="loading-line" style="position: absolute; width: 50px; height: 100%; background: #00f2ff; box-shadow: 0 0 10px #00f2ff;"></div>
                </div>

                <div id="thanks-text" style="color: #00f2ff; font-size: 38px; letter-spacing: 12px; font-weight: bold; text-shadow: 0 0 20px #00f2ff; position: relative; z-index: 10;">
                    TERIMA KASIH
                </div>
            `;
            document.body.appendChild(thankYouLayer);
            
            // 3. 重新启动 GSAP 动画

            // 动画 A：Loading 线条的流光效果 (从左到右循环流动)
            gsap.to("#loading-line", { 
                left: "100%", 
                duration: 1.5, 
                repeat: -1, 
                ease: "power1.inOut" 
            });

            // 动画 B：“TERIMA KASIH” 文字的呼吸闪烁效果 (模拟霓虹灯呼吸)
            gsap.to("#thanks-text", { 
                opacity: 0.3, 
                duration: 0.8, 
                repeat: -1, 
                yoyo: true, 
                ease: "power1.inOut"
            });
            
        } else {
            // 电脑端：维持原样，震撼播放启动视频
            v.muted = false;
            gsap.to("#main-ui", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('main-ui').style.display = 'none';
                document.getElementById('video-layer').style.display = 'block';
                v.play();
            }});
        }
    }
</script>
</body>
</html>
